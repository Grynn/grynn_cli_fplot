[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Grynn", email = "vishal.doshi@gmail.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "click >= 8.4.2",
  "matplotlib >= 3.11.1",
  "dateparser >= 1.4.2",
  "mplcursors >= 0.7.1",
  "mplfinance >= 0.12.10b0",
  "fastapi >= 0.141.1",
  "uvicorn >= 0.52.3",
  "scikit-learn >= 1.9.0",
  "grynn-pylib >= 0.3.1",
  "ipywidgets >= 8.1.8",
  "tabulate >= 0.10.0",
  "yfinance >= 1.6.0",
  "pandas >= 3.0.5",
]
description = "CLI tool for plotting financial data and analyzing options"
keywords = ["finance", "stocks", "options", "plotting", "cli"]
license = {text = "MIT"}
name = "grynn-fplot"
readme = "README.md"
requires-python = ">=3.12"
version = "0.4.9"

[project.scripts]
fplot = "grynn_fplot.cli:display_plot"

[project.urls]
Homepage = "https://github.com/Grynn/grynn_cli_fplot"
Issues = "https://github.com/Grynn/grynn_cli_fplot/issues"
Repository = "https://github.com/Grynn/grynn_cli_fplot"

[project.optional-dependencies]
dev = [
  "ipykernel >= 7.3.0",
  "ipython >= 9.16.1",
  "mypy >= 2.3.1",
  "pytest >= 9.1.1",
  "ruff >= 0.16.3",
]

[tool.uv.sources]
grynn-pylib = {git = "https://github.com/Grynn/grynn_pylib.git"}
yfinance = {git = "https://github.com/ranaroussi/yfinance.git"}

[dependency-groups]
dev = [
  "httpx >= 0.28.1",
  "pre-commit >= 4.6.2",
]

[tool.ruff]
line-length = 120
